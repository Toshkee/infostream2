# nginx site for infostream.co.me. Copy to /etc/nginx/sites-available/infostream
# and symlink into sites-enabled (or drop into /etc/nginx/conf.d/ on RHEL-style
# hosts). Files in those folders are included inside the `http {}` block, which
# is where limit_req_zone must live.
#
# TLS: the certificate paths below are the ones certbot writes. If the old site
# already has a certificate for infostream.co.me on this VPS, reuse its paths.

# Cloudflare proxies this domain (the apex A records are Cloudflare IPs), so
# $remote_addr is a Cloudflare edge, not the visitor. Without this block every
# visitor on earth shares a handful of buckets: the limit_req zone below and
# the app's per-IP limit would throttle real traffic while doing nothing about
# an abuser. real_ip_header restores the true client address from the header
# Cloudflare sets, trusted ONLY from these ranges.
# Refresh from https://www.cloudflare.com/ips/ if Cloudflare publishes changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# If Cloudflare's proxy is ever switched off (grey cloud / direct DNS), delete
# the block above: with it in place and no Cloudflare in front, nothing trusts
# the header, so $remote_addr stays correct either way.

# /api/chat spends Gemini credit, so each IP gets ~2 requests/second with a
# small burst. Tune here, not in the app: the app's own limiter is per process
# and resets on restart.
limit_req_zone $binary_remote_addr zone=infostream_chat:10m rate=2r/s;

upstream infostream_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name infostream.co.me www.infostream.co.me;

    # certbot's HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://infostream.co.me$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.infostream.co.me;

    ssl_certificate     /etc/letsencrypt/live/infostream.co.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infostream.co.me/privkey.pem;
    # certbot's managed TLS profile (protocols, ciphers, session cache). Without
    # it nginx falls back to compiled-in defaults, which on older builds still
    # negotiate TLS 1.0/1.1. Written by certbot on first issue.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://infostream.co.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name infostream.co.me;

    ssl_certificate     /etc/letsencrypt/live/infostream.co.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infostream.co.me/privkey.pem;
    # certbot's managed TLS profile (protocols, ciphers, session cache). Without
    # it nginx falls back to compiled-in defaults, which on older builds still
    # negotiate TLS 1.0/1.1. Written by certbot on first issue.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app sends CSP, HSTS and the other security headers itself
    # (next.config.ts); do not duplicate them here.
    server_tokens off;
    client_max_body_size 64k;   # the largest request is a chat message

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Connection        "";
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append: the app trusts this header only because nginx
    # sets it here (TRUSTED_PROXY=1 in /etc/infostream.env).
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;

    location = /api/chat {
        limit_req zone=infostream_chat burst=5 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;     # Gemini replies can take a while
        proxy_pass http://infostream_app;
    }

    location / {
        proxy_pass http://infostream_app;
    }
}
