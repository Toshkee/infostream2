# nginx site for infostream.co.me. Copy to /etc/nginx/sites-available/infostream
# and symlink into sites-enabled (or drop into /etc/nginx/conf.d/ on RHEL-style
# hosts). Files in those folders are included inside the `http {}` block, which
# is where limit_req_zone must live.
#
# TLS: the certificate paths below are the ones certbot writes. If the old site
# already has a certificate for infostream.co.me on this VPS, reuse its paths.

# /api/chat spends Gemini credit, so each IP gets ~2 requests/second with a
# small burst. Tune here, not in the app: the app's own limiter is per process
# and resets on restart.
limit_req_zone $binary_remote_addr zone=infostream_chat:10m rate=2r/s;

upstream infostream_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name infostream.co.me www.infostream.co.me;

    # certbot's HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://infostream.co.me$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.infostream.co.me;

    ssl_certificate     /etc/letsencrypt/live/infostream.co.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infostream.co.me/privkey.pem;

    return 301 https://infostream.co.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name infostream.co.me;

    ssl_certificate     /etc/letsencrypt/live/infostream.co.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infostream.co.me/privkey.pem;

    # The app sends CSP, HSTS and the other security headers itself
    # (next.config.ts); do not duplicate them here.
    server_tokens off;
    client_max_body_size 64k;   # the largest request is a chat message

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Connection        "";
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append: the app trusts this header only because nginx
    # sets it here (TRUSTED_PROXY=1 in /etc/infostream.env).
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;

    location = /api/chat {
        limit_req zone=infostream_chat burst=5 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;     # Gemini replies can take a while
        proxy_pass http://infostream_app;
    }

    location / {
        proxy_pass http://infostream_app;
    }
}
